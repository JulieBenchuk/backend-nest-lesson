prometheus:
  prometheusSpec:
    # Хранить метрики 5 дней
    retention: 5d
    # PersistentVolume для Prometheus
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

grafana:
  # Пароль администратора
  adminPassword: "your-secure-password"

  # PersistentVolume для Grafana
  persistence:
    enabled: true
    size: 2Gi

  # Ingress для доступа по домену
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - k8s-grafana.julie-benchuk-dev.xyz
    tls:
      - hosts:
          - k8s-grafana.julie-benchuk-dev.xyz
        secretName: grafana-tls
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod

  # Loki как дополнительный источник данных
  additionalDataSources:
    - name: Loki
      type: loki
  # loki.monitoring.svc.cluster.local — полный DNS-адрес Service внутри кластера. Формат: <service>.<namespace>.svc.cluster.local.
  # Grafana и Loki будут в одном namespace monitoring, поэтому можно написать просто http://loki:3100 — Kubernetes разрешит его внутри namespace.
      url: http://loki.monitoring.svc.cluster.local:3100
      editable: true

# Node Exporter включён по умолчанию — это DaemonSet,
# который сам разворачивается на каждой ноде, порт 9090
nodeExporter:
  enabled: true