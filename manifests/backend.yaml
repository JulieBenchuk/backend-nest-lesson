apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      # Kubernetes возьмёт этот imagePullSecrets и подставит токен при скачивании приватного образа. Сам контейнер об этом ничего не знает
      imagePullSecrets:
        - name: dockerhub-cred
      containers:
        - name: backend-api
          image: ${IMAGE}
          # Типичная рекомендация — ставить limit на ~20% выше request.
          resources:
            requests:
              # CPU измеряется в миллиядрах (m). 1000m = 1 ядро CPU.
              cpu: "80m"
              memory: "100Mi"
            limits:
              cpu: "100m"
              memory: "120Mi"
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret

---
apiVersion: v1
kind: Service
metadata:
  name: backend-api-service
  labels:
    app: backend-api   # ← лейбл для ServiceMonitor
spec:
  selector:
    app: backend-api
  ports:
    - name: http   # ← именованный порт
      port: 3000
      targetPort: 3000
  type: ClusterIP
