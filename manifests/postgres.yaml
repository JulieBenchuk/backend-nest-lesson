apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  # StatefulSet требует Headless Service. Через него Pod-ы получают стабильные DNS-имена вида postgres-0.postgres
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD
              # Подпапка "pgdata" внутри смонтированного тома.
              # Postgres требует чистую директорию при инициализации, а Kubernetes может положить в точку монтирования служебные файлы.
              # Подпапка решает этот конфликт.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  # clusterIP: None — это и есть Headless. DNS возвращает напрямую IP Pod-а, без виртуального адреса.
  # Backend обращается к базе по имени postgres — DNS кластера разрешит его в postgres-0.postgres.
  clusterIP: None