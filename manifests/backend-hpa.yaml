apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-api-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-api
  minReplicas: 1
  maxReplicas: 10
  # Текущее значение замеряется с помощью Metrics Server из пакета kube-prometheus-stack
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # target: 70% от CPU request, среднее значение по всем репликам
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80   # target: 80% от memory request, среднее значение по всем репликам