apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
        - name: backend-api
          image: juliebenchuk/cluster_backend:sha-727c6a621a71bf078b1d85659041826efa452112
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: "postgres.default.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "todos_user"
            - name: DB_PASSWORD
              value: "change_me_please"
            - name: DB_NAME
              value: "todos"