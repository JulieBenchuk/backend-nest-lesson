name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Главное — правильно сослаться на это имя:
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # Назвали как захотели. node-version, experimental, os - это просто имя переменной:
        node-version: [22]
        experimental: [false]
        os: [ubuntu-latest, windows-latest]
        # Дополнительная джоба к существующей матрице
        include:
          - node-version: 24
            experimental: true
            os: windows-latest
        # Исключить из матрицы джобу
        exclude:
          - os: windows-latest
            node-version: 22

    steps:
      - uses: actions/checkout@v4

      - name: Кэш node_modules
        uses: actions/cache@v4 # Распаковка пакетов не требуется, они распакованы и закэшированы
        with:
          # что кэшировать
          path: node_modules
          # уникальный ключ
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          # если точного совпадения нет, берётся последний кэш с совпадающим префиксом (частичное восстановление)
          restore-keys: |
              ${{ runner.os }}-node-

      - uses: actions/setup-node@v4
        with:
          # Главное — правильно сослаться на это имя:
          node-version: ${{ matrix.node-version }}
          # Это кэш пакетного менеджера, не node_modules. Нужна распаковка пакетов.
          # npm ci берёт тарболы из ~/.npm и распаковывает локально — это быстрее сети, но медленнее восстановления готового node_modules.
          cache: 'npm'

      - name: Установка зависимостей
        run: npm ci

      - name: Линтинг
        run: npm run lint

      - name: Запуск тестов
        run: npm run test