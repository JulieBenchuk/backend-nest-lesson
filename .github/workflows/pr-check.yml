name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Главное — правильно сослаться на это имя:
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # Назвали как захотели. node-version, experimental, os - это просто имя переменной:
        node-version: [22]
        experimental: [false]
        os: [ubuntu-latest, windows-latest]
        # Дополнительная джоба к существующей матрице
        include:
          - node-version: 24
            experimental: true
            os: windows-latest
        # Исключить из матрицы джобу
        exclude:
          - os: windows-latest
            node-version: 22

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Главное — правильно сослаться на это имя:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Установка зависимостей
        run: npm ci

      - name: Линтинг
        run: npm run lint

      - name: Запуск тестов
        run: npm run test