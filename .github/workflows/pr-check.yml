name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  security-scan:
    name: "Security scan"
    uses: ./.github/workflows/sast-sca.yml
  test:
    runs-on: ${{ matrix.os }}
    # Главное — правильно сослаться на это имя:
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: true
      matrix:
        # Назвали как захотели. node-version, experimental, os - это просто имя переменной:
        node-version: [22]
        experimental: [false]
        os: [ubuntu-latest, windows-latest]
        # Исключить из матрицы джобу
        exclude:
          - os: windows-latest
            node-version: 22

    steps:
      # скачивает репозиторий с кодом на виртуальную машину (раннер) GitHub Actions, где выполняется джоба
      - uses: actions/checkout@v4

      - name: Кэш node_modules
        uses: actions/cache@v4 # Распаковка пакетов не требуется, они распакованы и закэшированы
        with:
          # что кэшировать
          path: node_modules
          # уникальный ключ, с учетом ОС и версии Node
          key: ${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
          # restore-keys смягчает промахи: если точный ключ не найден, берётся ближайший по префиксу.
          # npm ci всё равно доустановит недостающее, но большую часть пакетов возьмёт из частичного кэша.
          restore-keys: |
              ${{ runner.os }}-node${{ matrix.node-version }}-

      - uses: actions/setup-node@v4
        with:
          # Главное — правильно сослаться на это имя:
          node-version: ${{ matrix.node-version }}
          # cache: 'npm' - это кэш пакетного менеджера, не node_modules. Нужна распаковка пакетов
          # npm ci берёт тарболы из ~/.npm и распаковывает локально — это быстрее сети, но медленнее восстановления готового node_modules.
#          cache: 'npm'

      - name: Установка зависимостей
        run: npm ci

      - name: Линтинг
        run: npm run lint

      - name: Запуск тестов
        run: npm run test