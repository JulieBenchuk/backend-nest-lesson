name: Deploy

on:
  push:
    branches: [main]

jobs:
  checks:
    # REUSABLE WORKFLOW
    uses: ./.github/workflows/pr-check.yml

  build:
    needs: [checks]
    # REUSABLE WORKFLOW
    uses: ./.github/workflows/build.yml
    with:
      DOCKER_USER: ${{ vars.DOCKER_USER }}
    secrets:
      DOCKER_PASS: ${{ secrets.DOCKER_PASS }}

  deploy:
    needs: [ build ]
    uses: ./.github/workflows/deploy-argocd.yml
    with:
      helm_path: HelmCharts/backend-api/values.yaml
      image_name: ${{ needs.build.outputs.image_sha }}
      branch: main
      gitops_repo: JulieBenchuk/argocd-cluster
      argocd_app_name: backend-api
      argocd_server: ${{ vars.ARGOCD_SERVER }}
    secrets:
      gitops_token: ${{ secrets.GITOPS_TOKEN }}
      argocd_auth_token: ${{ secrets.ARGOCD_AUTH_TOKEN }}


  notify:
    needs: [checks, build, deploy]
    # REUSABLE WORKFLOW
    uses: ./.github/workflows/notify.yml
    if: always()  # ← запускается всегда, даже если checks или deploy джобы упали
    # дочерний файл не имеет прямого доступа к секретам вашего основного репозитория
    secrets:
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    # Передаем итоговый статус в reusable workflow через with, там он будет виден в inputs
    with:
      checks_result: ${{ needs.checks.result }}
      deploy_result: ${{ needs.deploy.result }}
      build_status: ${{ needs.build.result }}
