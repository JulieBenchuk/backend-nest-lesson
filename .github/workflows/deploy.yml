name: Deploy

on:
  push:
    branches: [main]

jobs:
  checks:
    # REUSABLE WORKFLOW
    uses: ./.github/workflows/pr-check.yml

  build:
    needs: [checks]
    # REUSABLE WORKFLOW
    uses: ./.github/workflows/build.yml
    with:
      DOCKER_USER: ${{ vars.DOCKER_USER }}
    secrets:
      DOCKER_PASS: ${{ secrets.DOCKER_PASS }}


  deploy:
    # Это дает нам право читать аутпуты джобы build
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/cluster
            
            # Берём имя образа из output предыдущего build job. И подставляем в .env взамен предыдущего значения DOCKER_IMAGE
            sed -i "s|DOCKER_IMAGE=.*|DOCKER_IMAGE=${{ needs.build.outputs.image_sha }}|" .env
            
            # Скачиваем обновленный образ с Docker Hub 
            docker compose pull backend
            
            # Перезапускаем только backend c новым DOCKER_IMAGE=username/backend:sha-a3f9c12 в .env на сервере
            docker compose up -d --no-deps backend

  notify:
    needs: [checks, build, deploy]
    # REUSABLE WORKFLOW
    uses: ./.github/workflows/notify.yml
    if: always()  # ← запускается всегда, даже если checks или deploy джобы упали
    # дочерний файл не имеет прямого доступа к секретам вашего основного репозитория
    secrets:
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    # Передаем итоговый статус в reusable workflow через with, там он будет виден в inputs
    with:
      checks_result: ${{ needs.checks.result }}
      deploy_result: ${{ needs.deploy.result }}
      build_status: ${{ needs.build.result }}
