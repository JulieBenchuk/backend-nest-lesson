name: Deploy

on:
  push:
    branches: [main]

jobs:
  checks:
    uses: ./.github/workflows/pr-check.yml

  build:
    needs: [checks]
    runs-on: ubuntu-latest
    outputs:
      image_sha: ${{ steps.build-push.outputs.image_sha }}  # передаём в deploy по step id "build-push"
    steps:
      # скачивает репозиторий с кодом на виртуальную машину (раннер) GitHub Actions, где выполняется джоба
      - uses: actions/checkout@v4

      - name: Вход в DockerHub
        run: docker login -u ${{ vars.DOCKER_USER }} -p ${{ secrets.DOCKER_PASS }}

      - name: Билд и пуш образа
        id: build-push
        # обявляем переменные, т.к. имя образа переиспользуется и чтобы проще его переименовать при необходимости
        # по умолчанию переменные env доступны только в своей джобе
        env:
          IMAGE_SHA: ${{ vars.DOCKER_USER }}/cluster_backend:sha-${{ github.sha }}
          IMAGE_LATEST: ${{ vars.DOCKER_USER }}/cluster_backend:latest
        run: |
          docker build -t $IMAGE_SHA -t $IMAGE_LATEST .
          
          docker push $IMAGE_SHA
          docker push $IMAGE_LATEST
          
          # Передача данных между шагами или джобами в рамках одного пайплайна
          # Формирует строку формата ключ=значение. Перенаправляет эту строку в секретный временный файл, путь к которому хранится в системной переменной $GITHUB_OUTPUT.
          echo "image_sha=$IMAGE_SHA" >> $GITHUB_OUTPUT

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/cluster
            
            # Берём имя образа из output предыдущего job'а, не дублируем. И подставляем в энв взамен предыдущего значения
            sed -i "s|DOCKER_IMAGE=.*|DOCKER_IMAGE=${{ needs.build.outputs.image_sha }}|" .env
            
            # Перезапускаем только backend, не трогая frontend и db
            docker compose up -d --no-deps backend

  notify:
    needs: [checks, build, deploy]
    uses: ./.github/workflows/notify.yml
    if: always()  # ← запускается всегда, даже если checks или deploy джобы упали
    secrets:
      TELEGRAM_CHAT_ID: secrets.TELEGRAM_CHAT_ID
      TELEGRAM_BOT_TOKEN: secrets.TELEGRAM_BOT_TOKEN
