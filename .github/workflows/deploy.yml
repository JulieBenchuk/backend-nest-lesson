name: Deploy

on:
  push:
    branches: [main]

jobs:
  checks:
    uses: ./.github/workflows/pr-check.yml

  build:
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      # скачивает репозиторий с кодом на виртуальную машину (раннер) GitHub Actions, где выполняется джоба
      - uses: actions/checkout@v4

      - name: Вход в DockerHub
        run: docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PASS }}

      - name: Билд и пуш образа
        # обявляем переменные, т.к. имя образа переиспользуется и чтобы проще его переименовать при необходимости
        env:
          IMAGE_SHA: ${{ secrets.DOCKER_USER }}/cluster_backend:sha-${{ github.sha }}
          IMAGE_LATEST: ${{ secrets.DOCKER_USER }}/cluster_backend:latest
        run: |
          docker build -t $IMAGE_SHA -t $IMAGE_LATEST .
          
          docker push $IMAGE_SHA
          docker push $IMAGE_LATEST

