name: Deploy

on:
  push:
    branches: [main]

jobs:
  checks:
    # REUSABLE WORKFLOW
    uses: ./.github/workflows/pr-check.yml

  build:
    needs: [checks]
    # REUSABLE WORKFLOW
    uses: ./.github/workflows/build.yml
    with:
      DOCKER_USER: ${{ vars.DOCKER_USER }}
    secrets:
      DOCKER_PASS: ${{ secrets.DOCKER_PASS }}

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        # на раннере гитхаб создается папка и в нее помещается конфиг с секретом KUBE_CONFIG
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      # =========================================================================
      # ПОДХОД 1: СТАРЫЙ ДЕПЛОЙ ЧЕРЕЗ СЫРЫЕ МАНИФЕСТЫ (Закомментирован для истории)
      # =========================================================================
      # - name: Deploy to k3s (Old Way)
      #   env:
      #     IMAGE: \${{ needs.build.outputs.image_sha }}
      #   # envsubst читает manifests/backend.yaml, заменяет \${IMAGE} на реальное значение переменной и передаёт результат в kubectl apply.
      #   # В репозиторий ничего не коммитится — в кластер уходит актуальный манифест с конкретным SHA.
      #   # annotate добавляет описание к истории ревизий в виде sha, иначе там будет <none>
      #   run: |
      #     envsubst < manifests/backend.yaml | kubectl apply -f -
      #     kubectl annotate deployment/backend-api kubernetes.io/change-cause="sha-\${{ github.sha}}" --overwrite
      #     kubectl rollout status deployment/backend-api --timeout=120s

      # =========================================================================
      # ПОДХОД 2: НОВЫЙ ДЕПЛОЙ ЧЕРЕЗ HELM CHARTS (Активный подход)
      # =========================================================================
      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy with Helm
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_sha }}
        # Имя релиза: backend-api, Путь к чарту: ./helm/backend-api
        run: |
          helm upgrade backend-api ./helm/backend-api \
            --install \
            --reuse-values \
            --set image.name="\$IMAGE_TAG" \
            --wait \
            --timeout 4m


  notify:
    needs: [checks, build, deploy]
    # REUSABLE WORKFLOW
    uses: ./.github/workflows/notify.yml
    if: always()  # ← запускается всегда, даже если checks или deploy джобы упали
    # дочерний файл не имеет прямого доступа к секретам вашего основного репозитория
    secrets:
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    # Передаем итоговый статус в reusable workflow через with, там он будет виден в inputs
    with:
      checks_result: ${{ needs.checks.result }}
      deploy_result: ${{ needs.deploy.result }}
      build_status: ${{ needs.build.result }}
