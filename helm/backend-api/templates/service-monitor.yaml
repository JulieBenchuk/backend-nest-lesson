# Файл с ресурсом ServiceMonitor нужен для того, чтобы автоматически указать Prometheus, откуда именно ему нужно собирать (скрейпить) метрики вашего приложения.
# Это связующее звено между вашим бэкендом и системой мониторинга.
# Без этого файла Prometheus развернется в кластере, но будет собирать метрики только сам с себя и с системных компонентов Kubernetes. Он «не узнает» о существовании вашего приложения backend-api.

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-monitor
  labels:
    release: kube-prometheus-stack   # ← должен совпадать с именем release Helm
spec:
  selector:
    matchLabels:
      app: backend-api
  endpoints:
    - port: http      # имя порта из Service (backend-api-service)
      path: /metrics
      interval: 15s